[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lawn-weed-vision"
version = "0.3.0"
description = "Local-first segmentation API for a lawn-weeding vision prototype"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements-api.txt", "requirements-model.txt"]}

[tool.setuptools.packages.find]
include = ["weed_vision*"]

[tool.setuptools.package-data]
weed_vision = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
